[features]  # defines the plugin features contained into this plugin
instruments = false  # true if plugin contains instrument classes (else false, notice the lowercase for toml files)
extensions = true  # true if plugins contains dashboard extensions
models = false  # true if plugins contains pid models
h5exporters = false  # true if plugin contains custom h5 file exporters
scanners = false  # true if plugin contains custom scan layout (daq_scan extensions)

[urls]
package-url = 'https://github.com/ecordina/PyMoDAQ/tree/lab/lab/pymodaq_plugins_thermospectro'  # the lab repository

[project]
name = "pymodaq_plugins_thermospectro"
description = 'PyMoDAQ applications: spectrometers and a camera with thermal controllers (held at a temperature or ramped), logged to h5'
dependencies = [
    "pymodaq>=5.3.0",
    "pymodaq_utils>=5.3.0",
    "pymodaq_gui>=5.3.0",
    "pymodaq_data>=5.3.0",
    "numpy",
    "h5py",
    "tifffile",  # the tif files of lab_export
]

authors = [
    {name = "E. Cordina", email = "emmanuel.cordina@inrae.fr"},
]
maintainers = [
    {name = "E. Cordina", email = "emmanuel.cordina@inrae.fr"},
]

# nottodo: leave everything below as is!

dynamic = ["version", "urls", "entry-points"]
readme = "README.rst"
license = { file="LICENSE" }
requires-python = ">=3.10"

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Human Machine Interfaces",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: User Interfaces",
]

[project.scripts]
thermo_2spectro = "pymodaq_plugins_thermospectro.launcher:thermo_2spectro"  # 2 spectrometers, 2 thermal controllers
thermo_spectro = "pymodaq_plugins_thermospectro.launcher:thermo_spectro"  # 1 spectrometer, 1 thermal controller
camera = "pymodaq_plugins_thermospectro.launcher:camera"  # 1 camera
thermo_camera = "pymodaq_plugins_thermospectro.launcher:thermo_camera"  # 1 camera, 1 thermal controller
thermo_camera_spectro = "pymodaq_plugins_thermospectro.launcher:thermo_camera_spectro"  # 1 camera, 1 spectrometer, 1 thermal controller
lab_apps = "pymodaq_plugins_thermospectro.apps:main"  # the names of the applications above
lab_export = "pymodaq_plugins_thermospectro.export:main"  # csv, tif and txt files from the h5 file of an experiment

[build-system]
requires = [
    "hatchling>=1.9.0",
    "hatch-vcs", "toml",
    "pymodaq_utils>=0.0.6",
]
build-backend = "hatchling.build"

[tool.hatch.metadata.hooks.custom]

[tool.hatch.version]
source = "vcs"
fallback-version = "0.1.0.dev0"  # used when the package is built outside of a git repository / without tags

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
